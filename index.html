<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SAN ANDREAS GPS // REAL WORLD RADAR</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <!-- Google Fonts for GTA SA HUD Style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --sa-bg: rgba(12, 14, 12, 0.90);
      --sa-border: #3a443a;
      --sa-green: #539e46;
      --sa-green-bright: #74d662;
      --sa-gold: #e5b84b;
      --sa-red: #d94343;
      --sa-blue: #4a90e2;
      --sa-text: #f0f2f0;
      --sa-muted: #9aa59a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1c2833;
      font-family: 'Oswald', sans-serif;
      color: var(--sa-text);
    }

    /* Map Container & GTA SA Tile Color Grading */
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #2b3e50;
    }

    /* Tuned CSS Filter to transform OpenStreetMap into 2004 GTA San Andreas Radar colors */
    .leaflet-tile-pane {
      filter: sepia(45%) hue-rotate(48deg) saturate(135%) brightness(78%) contrast(122%);
    }

    .leaflet-control-attribution {
      background: rgba(0, 0, 0, 0.7) !important;
      color: #888 !important;
      font-size: 10px !important;
      font-family: sans-serif;
    }
    .leaflet-control-attribution a {
      color: var(--sa-green-bright) !important;
    }

    /* Outlined GTA SA HUD Typography */
    .sa-title {
      font-family: 'Anton', sans-serif;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 
        -1.5px -1.5px 0 #000,  
         1.5px -1.5px 0 #000,
        -1.5px  1.5px 0 #000,
         1.5px  1.5px 0 #000,
         0px    3px   4px rgba(0,0,0,0.8);
    }

    .sa-outline {
      text-shadow: 
        -1px -1px 0 #000,  
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    }

    /* Top HUD Bar */
    #top-hud {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }

    .hud-panel {
      background: var(--sa-bg);
      border: 2px solid var(--sa-border);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.75);
      pointer-events: auto;
    }

    /* Search Box */
    #search-container {
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    .search-bar {
      display: flex;
      align-items: center;
      padding: 6px 10px;
      gap: 8px;
    }

    .search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--sa-text);
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      letter-spacing: 0.5px;
      user-select: text;
    }

    .search-bar input::placeholder {
      color: var(--sa-muted);
      text-transform: uppercase;
    }

    .sa-btn {
      background: #1f261f;
      border: 1px solid #4d5d4d;
      color: var(--sa-text);
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.8px;
      transition: all 0.12s ease;
    }

    .sa-btn:hover {
      background: var(--sa-green);
      color: #fff;
      border-color: var(--sa-green-bright);
    }

    .sa-btn.active {
      background: var(--sa-gold);
      color: #000;
      border-color: #fff;
    }

    .sa-btn.danger:hover {
      background: var(--sa-red);
      border-color: #ff7b7b;
    }

    #search-results {
      display: none;
      max-height: 260px;
      overflow-y: auto;
      border-top: 1px solid var(--sa-border);
    }

    .search-item {
      padding: 9px 12px;
      border-bottom: 1px solid #222922;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .search-item:hover {
      background: rgba(83, 158, 70, 0.35);
    }

    .search-item-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Top Right Status HUD (Cash, Clock, Wanted Stars) */
    #status-hud {
      padding: 8px 14px;
      text-align: right;
      min-width: 175px;
    }

    #sa-clock {
      font-family: 'Anton', sans-serif;
      font-size: 24px;
      color: #c5d1c5;
      line-height: 1;
    }

    #sa-cash {
      font-family: 'Anton', sans-serif;
      font-size: 22px;
      color: var(--sa-green-bright);
      line-height: 1.15;
    }

    #wanted-stars {
      font-size: 16px;
      letter-spacing: 2px;
      color: #444;
      margin-top: 2px;
    }
    #wanted-stars .lit {
      color: var(--sa-gold);
      text-shadow: 0 0 6px rgba(229, 184, 75, 0.8);
    }

    /* Left/Bottom Navigation & Bookmarks Drawer */
    #side-panel {
      position: fixed;
      top: 72px;
      left: 14px;
      width: 340px;
      max-width: calc(100vw - 28px);
      max-height: calc(100vh - 150px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      border-bottom: 2px solid var(--sa-border);
    }

    .tab-btn {
      flex: 1;
      background: #141814;
      border: none;
      color: var(--sa-muted);
      font-family: 'Anton', sans-serif;
      font-size: 15px;
      letter-spacing: 1px;
      padding: 9px 4px;
      cursor: pointer;
      border-right: 1px solid var(--sa-border);
    }
    .tab-btn:last-child { border-right: none; }
    .tab-btn.active {
      background: var(--sa-green);
      color: #fff;
    }

    .tab-content {
      display: none;
      padding: 12px;
      overflow-y: auto;
      flex: 1;
    }
    .tab-content.active {
      display: block;
    }

    /* Route Controls */
    .route-modes {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .route-modes .sa-btn {
      flex: 1;
      text-align: center;
      padding: 6px 4px;
    }

    .waypoint-box {
      background: #171c17;
      border: 1px solid #333e33;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .waypoint-label {
      color: var(--sa-gold);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #route-summary {
      background: rgba(83, 158, 70, 0.2);
      border: 1px solid var(--sa-green);
      padding: 8px;
      margin-top: 8px;
      display: none;
    }

    .turn-list {
      margin-top: 8px;
      max-height: 180px;
      overflow-y: auto;
      border-top: 1px solid #2d362d;
    }
    .turn-step {
      padding: 6px 4px;
      border-bottom: 1px solid #222922;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .turn-dist {
      color: var(--sa-gold);
      white-space: nowrap;
      font-weight: 600;
    }

    /* Bookmarks & Legend Lists */
    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 6px;
      border-bottom: 1px solid #232a23;
      gap: 8px;
    }
    .list-item-info {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      flex: 1;
      overflow: hidden;
    }
    .list-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
    }

    /* Bottom Action Bar */
    #bottom-hud {
      position: fixed;
      bottom: 16px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
    }

    .bottom-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    #zone-banner {
      font-family: 'Anton', sans-serif;
      font-size: 28px;
      color: var(--sa-text);
      text-align: right;
      pointer-events: none;
      line-height: 1.1;
    }
    #zone-sub {
      font-family: 'Oswald', sans-serif;
      font-size: 14px;
      color: var(--sa-gold);
      letter-spacing: 1px;
    }

    /* Cheat Banner */
    #cheat-banner {
      position: fixed;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.88);
      border: 2px solid var(--sa-gold);
      color: var(--sa-text);
      padding: 8px 18px;
      font-family: 'Anton', sans-serif;
      font-size: 18px;
      letter-spacing: 1.5px;
      z-index: 2000;
      display: none;
      text-transform: uppercase;
    }

    /* Custom GTA SA Map Blips */
    .sa-blip {
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.9));
      transition: transform 0.15s ease;
    }
    .sa-blip:hover {
      transform: scale(1.22);
    }

    /* Player Arrow Blip */
    .cj-arrow {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 5px rgba(0,0,0,1));
    }

    /* Leaflet Popup Styling */
    .leaflet-popup-content-wrapper {
      background: var(--sa-bg) !important;
      color: var(--sa-text) !important;
      border: 2px solid var(--sa-green) !important;
      border-radius: 0 !important;
      font-family: 'Oswald', sans-serif !important;
    }
    .leaflet-popup-tip {
      background: var(--sa-green) !important;
    }
    .popup-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    @media (max-width: 640px) {
      #side-panel {
        top: auto;
        bottom: 62px;
        max-height: 45vh;
        width: calc(100vw - 28px);
      }
      #status-hud {
        display: none;
      }
      #zone-banner {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <div id="cheat-banner" class="sa-outline">CHEAT ACTIVATED</div>

  <!-- TOP HUD -->
  <div id="top-hud">
    <div id="search-container" class="hud-panel">
      <div class="search-bar">
        <span style="color: var(--sa-gold); font-weight: bold;">GPS</span>
        <input type="text" id="search-input" placeholder="Search city, street, landmark..." autocomplete="off" />
        <button class="sa-btn" id="search-btn">FIND</button>
      </div>
      <div id="search-results"></div>
    </div>

    <div id="status-hud" class="hud-panel">
      <div id="sa-clock" class="sa-outline">12:00</div>
      <div id="sa-cash" class="sa-outline">$00350000</div>
      <div id="wanted-stars" class="sa-outline">
        <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
      </div>
    </div>
  </div>

  <!-- LEFT DRAWER PANEL -->
  <div id="side-panel" class="hud-panel">
    <div class="tabs">
      <button class="tab-btn active" data-tab="nav-tab">GPS ROUTE</button>
      <button class="tab-btn" data-tab="bookmarks-tab">BLIPS</button>
      <button class="tab-btn" data-tab="legend-tab">LEGEND</button>
    </div>

    <!-- TAB 1: NAVIGATION -->
    <div id="nav-tab" class="tab-content active">
      <div class="route-modes">
        <button class="sa-btn active" data-mode="driving">INFERNUS</button>
        <button class="sa-btn" data-mode="cycling">BMX</button>
        <button class="sa-btn" data-mode="walking">SPRINT</button>
      </div>

      <div class="waypoint-box">
        <div class="waypoint-label">A // START POINT</div>
        <div id="start-label">Click "LOCATE ME" or click map</div>
      </div>

      <div class="waypoint-box">
        <div class="waypoint-label" style="color: var(--sa-red);">B // DESTINATION</div>
        <div id="end-label">Search a place or click map to set</div>
      </div>

      <div style="display: flex; gap: 6px;">
        <button class="sa-btn" id="calc-route-btn" style="flex: 2; background: var(--sa-green); color: #fff;">SET WAYPOINT</button>
        <button class="sa-btn danger" id="clear-route-btn" style="flex: 1;">CLEAR</button>
      </div>

      <div id="route-summary">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <strong id="route-dist" style="font-size: 18px; color: var(--sa-green-bright);">0.0 KM</strong>
            <span id="route-time" style="margin-left: 8px; color: #ddd;">0 MIN</span>
          </div>
          <button class="sa-btn" id="sim-drive-btn">DRIVE SIM</button>
        </div>
        <div class="turn-list" id="turn-list"></div>
      </div>
    </div>

    <!-- TAB 2: BOOKMARKS -->
    <div id="bookmarks-tab" class="tab-content">
      <div style="display: flex; gap: 6px; margin-bottom: 10px;">
        <button class="sa-btn" id="save-center-btn" style="flex: 1;">+ SAVE CURRENT VIEW</button>
        <button class="sa-btn" id="export-btn">EXPORT</button>
      </div>
      <div id="bookmarks-list"></div>
    </div>

    <!-- TAB 3: LEGEND & CHEATS -->
    <div id="legend-tab" class="tab-content">
      <div style="font-size: 12px; color: var(--sa-muted); margin-bottom: 8px;">
        TOGGLE MAP ICONS OR TYPE CHEATS ON KEYBOARD: <strong>HESOYAM</strong>, <strong>AEZAKMI</strong>, <strong>ROCKETMAN</strong>
      </div>
      <div id="legend-list"></div>
    </div>
  </div>

  <!-- BOTTOM HUD -->
  <div id="bottom-hud">
    <div class="bottom-controls">
      <button class="sa-btn" id="toggle-panel-btn">MENU</button>
      <button class="sa-btn" id="locate-me-btn" style="border-color: var(--sa-green-bright); color: var(--sa-green-bright);">◎ LOCATE ME (GPS)</button>
      <button class="sa-btn" id="follow-me-btn">AUTO-FOLLOW: OFF</button>
    </div>

    <div id="zone-banner" class="sa-title">
      <div id="zone-name">SAN ANDREAS</div>
      <div id="zone-sub" class="sa-outline">GPS SATELLITE ONLINE</div>
    </div>
  </div>

  <!-- MAP CANVAS -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <script>
    // ==========================================
    // 1. SYNTHESIZED GTA SA MENU SOUND EFFECTS
    // ==========================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'blip') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(780, now + 0.06);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (type === 'select') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(660, now);
          osc.frequency.setValueAtTime(880, now + 0.07);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'cheat') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(554, now + 0.08);
          osc.frequency.setValueAtTime(659, now + 0.16);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch (e) {}
    }

    // ==========================================
    // 2. GTA SA CUSTOM SVG BLIP ICONS
    // ==========================================
    const BLIP_TYPES = {
      cj: {
        label: 'Safehouse (CJ)',
        svg: `<svg width="26" height="26" viewBox="0 0 32 32"><rect x="3" y="3" width="26" height="26" fill="#000"/><rect x="5" y="5" width="22" height="22" fill="#539e46"/><text x="16" y="22" font-family="Anton, sans-serif" font-size="16" fill="#fff" text-anchor="middle">CJ</text></svg>`
      },
      mission: {
        label: 'Mission Marker',
        svg: `<svg width="26" height="26" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#000"/><circle cx="16" cy="16" r="10" fill="#e5b84b"/><text x="16" y="21" font-family="Anton, sans-serif" font-size="15" fill="#000" text-anchor="middle">S</text></svg>`
      },
      ammunation: {
        label: 'Ammu-Nation',
        svg: `<svg width="26" height="26" viewBox="0 0 32 32"><rect x="3" y="3" width="26" height="26" fill="#000"/><rect x="5" y="5" width="22" height="22" fill="#d94343"/><path d="M9 19h14v-3h-4l-2-3h-4v3H9z" fill="#fff"/></svg>`
      },
      burger: {
        label: 'Burger Shot',
        svg: `<svg width="26" height="26" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#000"/><circle cx="16" cy="16" r="10" fill="#e67e22"/><rect x="9" y="14" width="14" height="4" rx="2" fill="#fff"/></svg>`
      },
      paynspray: {
        label: "Pay 'n' Spray",
        svg: `<svg width="26" height="26" viewBox="0 0 32 32"><rect x="3" y="3" width="26" height="26" fill="#000"/><rect x="5" y="5" width="22" height="22" fill="#4a90e2"/><circle cx="16" cy="16" r="6" fill="#fff"/></svg>`
      },
      waypoint: {
        label: 'Target Waypoint',
        svg: `<svg width="28" height="28" viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" fill="#000"/><rect x="5" y="5" width="22" height="22" fill="#d94343"/><path d="M10 10l12 12M22 10L10 22" stroke="#fff" stroke-width="3.5"/></svg>`
      }
    };

    function createBlipIcon(type) {
      const def = BLIP_TYPES[type] || BLIP_TYPES.mission;
      return L.divIcon({
        className: 'sa-blip',
        html: def.svg,
        iconSize: [26, 26],
        iconAnchor: [13, 13],
        popupAnchor: [0, -14]
      });
    }

    // ==========================================
    // 3. INITIALIZE LEAFLET MAP (KEYLESS OSM)
    // ==========================================
    const map = L.map('map', {
      center: [34.0522, -118.2437], // Default: Los Santos (Los Angeles)
      zoom: 13,
      zoomControl: false
    });

    // Keyless OpenStreetMap Raster Tiles (Works everywhere without API keys)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors | GTA SA Radar HUD'
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // ==========================================
    // 4. LIVE USER GPS GEOLOCATION
    // ==========================================
    let userLatLng = null;
    let userMarker = null;
    let accuracyCircle = null;
    let watchId = null;
    let autoFollow = false;

    const playerIcon = L.divIcon({
      className: 'cj-arrow',
      html: `<svg id="cj-heading-svg" width="28" height="28" viewBox="0 0 32 32">
               <polygon points="16,2 28,28 16,22 4,28" fill="#ffffff" stroke="#000000" stroke-width="3"/>
             </svg>`,
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });

    function updateUserLocation(lat, lng, accuracy = 25, heading = 0, fly = false) {
      userLatLng = L.latLng(lat, lng);

      if (!userMarker) {
        userMarker = L.marker(userLatLng, { icon: playerIcon, zIndexOffset: 1000 })
          .addTo(map)
          .bindPopup(`<strong>CJ (YOU)</strong><br>Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`);
        accuracyCircle = L.circle(userLatLng, {
          radius: accuracy,
          color: '#74d662',
          fillColor: '#539e46',
          fillOpacity: 0.15,
          weight: 1
        }).addTo(map);
      } else {
        userMarker.setLatLng(userLatLng);
        accuracyCircle.setLatLng(userLatLng).setRadius(accuracy);
      }

      if (heading !== null && !isNaN(heading)) {
        const svg = document.getElementById('cj-heading-svg');
        if (svg) svg.style.transform = `rotate(${heading}deg)`;
      }

      // Automatically set as Start Point if none chosen yet
      if (!startPoint) {
        setStartPoint(userLatLng, 'Current GPS Location');
      }

      if (fly || autoFollow) {
        map.flyTo(userLatLng, Math.max(map.getZoom(), 15), { duration: 1.0 });
      }
    }

    function locateUser(flyOnLocate = true) {
      playSound('select');
      const zoneSub = document.getElementById('zone-sub');
      zoneSub.textContent = 'ACQUIRING GPS SATELLITE...';

      if (!navigator.geolocation) {
        zoneSub.textContent = 'GPS NOT SUPPORTED BY BROWSER';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude, accuracy, heading } = pos.coords;
          updateUserLocation(latitude, longitude, accuracy, heading, flyOnLocate);
          setStartPoint(L.latLng(latitude, longitude), 'My GPS Location');
          reverseGeocodeZone(latitude, longitude);
          zoneSub.textContent = `GPS LOCKED (±${Math.round(accuracy)}M)`;
        },
        (err) => {
          zoneSub.textContent = 'GPS PERMISSION DENIED / UNAVAILABLE';
          alert('Could not get your location. Make sure Location Services are enabled and allowed for this site (HTTPS required).');
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );

      // Continuous live tracking
      if (!watchId) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude, longitude, accuracy, heading } = pos.coords;
            updateUserLocation(latitude, longitude, accuracy, heading, false);
          },
          () => {},
          { enableHighAccuracy: true }
        );
      }
    }

    document.getElementById('locate-me-btn').addEventListener('click', () => locateUser(true));

    document.getElementById('follow-me-btn').addEventListener('click', function () {
      playSound('blip');
      autoFollow = !autoFollow;
      this.textContent = `AUTO-FOLLOW: ${autoFollow ? 'ON' : 'OFF'}`;
      this.classList.toggle('active', autoFollow);
      if (autoFollow && userLatLng) map.panTo(userLatLng);
    });

    // ==========================================
    // 5. SEARCH & GEOCODING (NOMINATIM)
    // ==========================================
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');

    async function searchPlaces() {
      const q = searchInput.value.trim();
      if (!q) return;
      playSound('select');

      searchResults.style.display = 'block';
      searchResults.innerHTML = `<div class="search-item">Scanning satellite database...</div>`;

      // Bias search near current map center
      const b = map.getBounds();
      const viewbox = `${b.getWest()},${b.getNorth()},${b.getEast()},${b.getSouth()}`;

      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=6&viewbox=${viewbox}`
        );
        const data = await res.json();

        if (!data.length) {
          searchResults.innerHTML = `<div class="search-item">No locations found.</div>`;
          return;
        }

        searchResults.innerHTML = '';
        data.forEach((place) => {
          const lat = parseFloat(place.lat);
          const lon = parseFloat(place.lon);
          const shortName = place.display_name.split(',').slice(0, 3).join(',');

          const div = document.createElement('div');
          div.className = 'search-item';
          div.innerHTML = `
            <span class="search-item-name" title="${place.display_name}">${shortName}</span>
            <button class="sa-btn">GO</button>
          `;
          div.addEventListener('click', () => {
            playSound('select');
            const ll = L.latLng(lat, lon);
            map.flyTo(ll, 15);
            setEndPoint(ll, shortName);
            calculateRoute();
            searchResults.style.display = 'none';
            document.getElementById('zone-name').textContent = place.display_name.split(',')[0].toUpperCase();
          });
          searchResults.appendChild(div);
        });
      } catch (e) {
        searchResults.innerHTML = `<div class="search-item">Search network error.</div>`;
      }
    }

    document.getElementById('search-btn').addEventListener('click', searchPlaces);
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchPlaces();
    });

    async function reverseGeocodeZone(lat, lng) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
        const data = await res.json();
        if (data && data.address) {
          const hood = data.address.suburb || data.address.neighbourhood || data.address.city || data.address.town || 'SAN ANDREAS';
          const city = data.address.city || data.address.state || 'REAL WORLD';
          document.getElementById('zone-name').textContent = hood.toUpperCase();
          document.getElementById('zone-sub').textContent = city.toUpperCase();
        }
      } catch (e) {}
    }

    // ==========================================
    // 6. OSRM ROUTING & TURN-BY-TURN GPS
    // ==========================================
    let startPoint = null;
    let endPoint = null;
    let startMarker = null;
    let endMarker = null;
    let routeLine = null;
    let routeCoords = [];
    let currentMode = 'driving';
    let simInterval = null;

    function setStartPoint(latlng, label) {
      startPoint = latlng;
      document.getElementById('start-label').textContent = label;
      if (startMarker) map.removeLayer(startMarker);
      startMarker = L.marker(latlng, { icon: createBlipIcon('cj') }).addTo(map);
    }

    function setEndPoint(latlng, label) {
      endPoint = latlng;
      document.getElementById('end-label').textContent = label;
      if (endMarker) map.removeLayer(endMarker);
      endMarker = L.marker(latlng, { icon: createBlipIcon('waypoint') }).addTo(map);
    }

    // Mode buttons
    document.querySelectorAll('.route-modes .sa-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        playSound('blip');
        document.querySelectorAll('.route-modes .sa-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        if (startPoint && endPoint) calculateRoute();
      });
    });

    async function calculateRoute() {
      if (!startPoint || !endPoint) {
        alert('Set both a Start Point (use Locate Me or click map) and a Destination first.');
        return;
      }
      playSound('select');

      const profile = currentMode === 'cycling' ? 'bike' : currentMode === 'walking' ? 'foot' : 'car';
      const url = `https://router.project-osrm.org/route/v1/${profile}/${startPoint.lng},${startPoint.lat};${endPoint.lng},${endPoint.lat}?overview=full&geometries=geojson&steps=true`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!data.routes || !data.routes.length) {
          alert('No route found between these two points.');
          return;
        }

        const route = data.routes[0];
        routeCoords = route.geometry.coordinates.map((c) => [c[1], c[0]]);

        if (routeLine) map.removeLayer(routeLine);
        routeLine = L.polyline(routeCoords, {
          color: '#d94343',
          weight: 6,
          opacity: 0.92
        }).addTo(map);

        map.fitBounds(routeLine.getBounds(), { padding: [60, 60] });

        // Update Summary
        const km = (route.distance / 1000).toFixed(2);
        const mins = Math.max(1, Math.round(route.duration / 60));
        document.getElementById('route-dist').textContent = `${km} KM`;
        document.getElementById('route-time').textContent = `${mins} MIN`;
        document.getElementById('route-summary').style.display = 'block';

        // Turn-by-turn steps
        const turnList = document.getElementById('turn-list');
        turnList.innerHTML = '';
        route.legs[0].steps.forEach((step) => {
          const text = step.maneuver.type.replace(/_/g, ' ').toUpperCase() + (step.name ? ` onto ${step.name}` : '');
          const d = step.distance > 1000 ? `${(step.distance / 1000).toFixed(1)}km` : `${Math.round(step.distance)}m`;
          const div = document.createElement('div');
          div.className = 'turn-step';
          div.innerHTML = `<span>${text}</span><span class="turn-dist">${d}</span>`;
          turnList.appendChild(div);
        });
      } catch (e) {
        alert('Routing service temporarily unavailable.');
      }
    }

    document.getElementById('calc-route-btn').addEventListener('click', calculateRoute);

    document.getElementById('clear-route-btn').addEventListener('click', () => {
      playSound('blip');
      if (simInterval) clearInterval(simInterval);
      if (routeLine) map.removeLayer(routeLine);
      if (endMarker) map.removeLayer(endMarker);
      endPoint = null;
      routeCoords = [];
      document.getElementById('end-label').textContent = 'Search a place or click map to set';
      document.getElementById('route-summary').style.display = 'none';
    });

    // Drive Simulator along calculated route
    document.getElementById('sim-drive-btn').addEventListener('click', function () {
      if (!routeCoords.length) return;
      if (simInterval) {
        clearInterval(simInterval);
        simInterval = null;
        this.textContent = 'DRIVE SIM';
        return;
      }
      playSound('select');
      this.textContent = 'STOP SIM';
      let idx = 0;
      simInterval = setInterval(() => {
        if (idx >= routeCoords.length) {
          clearInterval(simInterval);
          simInterval = null;
          this.textContent = 'MISSION PASSED!';
          playSound('cheat');
          return;
        }
        const [lat, lng] = routeCoords[idx];
        updateUserLocation(lat, lng, 10, 0, true);
        idx += 2;
      }, 250);
    });

    // Click anywhere on map to set Start / Destination / Save Blip
    map.on('click', (e) => {
      playSound('blip');
      const { lat, lng } = e.latlng;
      const popupHtml = `
        <div style="min-width: 170px;">
          <strong style="color: var(--sa-gold); font-size: 14px;">COORDINATES</strong><br>
          <span style="font-size: 12px;">${lat.toFixed(5)}, ${lng.toFixed(5)}</span>
          <div class="popup-actions">
            <button class="sa-btn" onclick="window.setMapStart(${lat}, ${lng})">START</button>
            <button class="sa-btn" onclick="window.setMapEnd(${lat}, ${lng})">DEST</button>
            <button class="sa-btn" onclick="window.quickBookmark(${lat}, ${lng})">+BLIP</button>
          </div>
        </div>
      `;
      L.popup().setLatLng(e.latlng).setContent(popupHtml).openOn(map);
    });

    window.setMapStart = (lat, lng) => {
      map.closePopup();
      setStartPoint(L.latLng(lat, lng), `Pinned (${lat.toFixed(4)}, ${lng.toFixed(4)})`);
      if (endPoint) calculateRoute();
    };

    window.setMapEnd = (lat, lng) => {
      map.closePopup();
      setEndPoint(L.latLng(lat, lng), `Target (${lat.toFixed(4)}, ${lng.toFixed(4)})`);
      calculateRoute();
    };

    // ==========================================
    // 7. BOOKMARKS & LEGEND SYSTEM
    // ==========================================
    const DEFAULT_BOOKMARKS = [
      { id: 1, name: 'Grove Street (Los Santos)', lat: 33.9214, lng: -118.2345, type: 'cj' },
      { id: 2, name: 'Santa Maria Beach Pier', lat: 34.0092, lng: -118.4976, type: 'burger' },
      { id: 3, name: 'Vinewood Sign Overlook', lat: 34.1341, lng: -118.3215, type: 'mission' },
      { id: 4, name: 'Los Santos International', lat: 33.9416, lng: -118.4085, type: 'paynspray' }
    ];

    let bookmarks = JSON.parse(localStorage.getItem('gta_sa_bookmarks')) || DEFAULT_BOOKMARKS;
    let bookmarkMarkers = [];
    let visibleTypes = { cj: true, mission: true, ammunation: true, burger: true, paynspray: true };

    function renderBookmarks() {
      localStorage.setItem('gta_sa_bookmarks', JSON.stringify(bookmarks));
      bookmarkMarkers.forEach((m) => map.removeLayer(m));
      bookmarkMarkers = [];

      const list = document.getElementById('bookmarks-list');
      list.innerHTML = '';

      bookmarks.forEach((bm) => {
        if (visibleTypes[bm.type] !== false) {
          const marker = L.marker([bm.lat, bm.lng], { icon: createBlipIcon(bm.type) })
            .addTo(map)
            .bindPopup(`
              <strong>${bm.name}</strong><br>
              <div class="popup-actions">
                <button class="sa-btn" onclick="window.setMapEnd(${bm.lat}, ${bm.lng})">SET WAYPOINT</button>
              </div>
            `);
          bookmarkMarkers.push(marker);
        }

        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div class="list-item-info">
            ${BLIP_TYPES[bm.type]?.svg || BLIP_TYPES.mission.svg}
            <span class="list-item-title">${bm.name}</span>
          </div>
          <button class="sa-btn danger" title="Delete">X</button>
        `;
        item.querySelector('.list-item-info').addEventListener('click', () => {
          playSound('select');
          map.flyTo([bm.lat, bm.lng], 15);
        });
        item.querySelector('button').addEventListener('click', () => {
          playSound('blip');
          bookmarks = bookmarks.filter((b) => b.id !== bm.id);
          renderBookmarks();
        });
        list.appendChild(item);
      });
    }

    window.quickBookmark = (lat, lng) => {
      map.closePopup();
      const name = prompt('Enter GTA Blip Name:', 'Custom Safehouse');
      if (!name) return;
      const types = ['cj', 'mission', 'ammunation', 'burger', 'paynspray'];
      const type = types[Math.floor(Math.random() * types.length)];
      bookmarks.push({ id: Date.now(), name, lat, lng, type });
      renderBookmarks();
      playSound('select');
    };

    document.getElementById('save-center-btn').addEventListener('click', () => {
      const c = map.getCenter();
      window.quickBookmark(c.lat, c.lng);
    });

    document.getElementById('export-btn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(bookmarks, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'gta_sa_blips.json';
      a.click();
    });

    function renderLegend() {
      const legendList = document.getElementById('legend-list');
      legendList.innerHTML = '';
      Object.entries(BLIP_TYPES).forEach(([key, val]) => {
        if (key === 'waypoint') return;
        const row = document.createElement('div');
        row.className = 'list-item';
        row.innerHTML = `
          <div class="list-item-info">
            ${val.svg}
            <span class="list-item-title">${val.label}</span>
          </div>
          <button class="sa-btn ${visibleTypes[key] ? 'active' : ''}">${visibleTypes[key] ? 'ON' : 'OFF'}</button>
        `;
        row.querySelector('button').addEventListener('click', function () {
          playSound('blip');
          visibleTypes[key] = !visibleTypes[key];
          this.textContent = visibleTypes[key] ? 'ON' : 'OFF';
          this.classList.toggle('active', visibleTypes[key]);
          renderBookmarks();
        });
        legendList.appendChild(row);
      });
    }

    // ==========================================
    // 8. TABS, CLOCK & EASTER EGG CHEAT CODES
    // ==========================================
    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        playSound('blip');
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach((c) => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    document.getElementById('toggle-panel-btn').addEventListener('click', () => {
      playSound('blip');
      const panel = document.getElementById('side-panel');
      panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
    });

    // Real-time Clock
    setInterval(() => {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('sa-clock').textContent = `${hh}:${mm}`;
    }, 1000);

    // Keyboard Cheat Codes
    let keyBuffer = '';
    let cash = 350000;
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === searchInput) return;
      keyBuffer = (keyBuffer + e.key.toUpperCase()).slice(-15);

      if (keyBuffer.endsWith('HESOYAM')) {
        cash += 250000;
        document.getElementById('sa-cash').textContent = '$' + String(cash).padStart(8, '0');
        triggerCheat('HESOYAM // +$250,000 & FULL ARMOR');
        keyBuffer = '';
      } else if (keyBuffer.endsWith('AEZAKMI')) {
        document.querySelectorAll('#wanted-stars span').forEach((s) => s.classList.remove('lit'));
        triggerCheat('AEZAKMI // NEVER WANTED');
        keyBuffer = '';
      } else if (keyBuffer.endsWith('BRINGITON')) {
        document.querySelectorAll('#wanted-stars span').forEach((s) => s.classList.add('lit'));
        triggerCheat('BRINGITON // 6-STAR WANTED LEVEL');
        keyBuffer = '';
      } else if (keyBuffer.endsWith('ROCKETMAN')) {
        map.setZoom(18);
        triggerCheat('ROCKETMAN // JETPACK AERIAL ZOOM');
        keyBuffer = '';
      }
    });

    function triggerCheat(msg) {
      playSound('cheat');
      const banner = document.getElementById('cheat-banner');
      banner.textContent = msg;
      banner.style.display = 'block';
      setTimeout(() => { banner.style.display = 'none'; }, 3000);
    }

    // Boot Sequence
    renderBookmarks();
    renderLegend();
    // Automatically attempt to locate user on startup
    locateUser(true);
  </script>
</body>
</html>
